<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bar Tab Manager</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #f0ede8;
  --surface:    #ffffff;
  --surface2:   #f7f5f2;
  --border:     rgba(0,0,0,0.08);
  --border2:    rgba(0,0,0,0.14);
  --text:       #1a1814;
  --text2:      #6b6560;
  --text3:      #a09890;
  --accent:     #2563eb;
  --accent-dim: rgba(37,99,235,0.09);
  --accent-bdr: rgba(37,99,235,0.28);
  --green:      #16a34a;
  --green-dim:  rgba(22,163,74,0.09);
  --green-bdr:  rgba(22,163,74,0.22);
  --red:        #dc2626;
  --red-dim:    rgba(220,38,38,0.08);
  --red-bdr:    rgba(220,38,38,0.22);
  --r:  8px;
  --rl: 12px;
  --sh: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh; width: 100vw;
  font-size: 13px;
}

/* ── Canvas ── */
#canvas {
  width: 100vw; height: 100vh;
  position: relative; overflow: hidden;
  cursor: default; user-select: none;
}
#grid-svg   { position: absolute; inset: 0; pointer-events: none; }
#tabs-layer { position: absolute; inset: 0; pointer-events: none; }

/* ── Toolbar ── */
#toolbar {
  position: absolute; top: 16px; left: 50%;
  transform: translateX(-50%);
  z-index: 300;
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 0.5px solid var(--border2);
  border-radius: 40px; padding: 7px 14px;
  box-shadow: var(--sh); white-space: nowrap;
}
.brand {
  font-size: 14px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  padding-right: 10px; border-right: 0.5px solid var(--border2);
  color: var(--text);
}
.brand svg { color: var(--text2); }
.tb-btn {
  background: none; border: 0.5px solid var(--border2);
  border-radius: 30px; padding: 5px 13px;
  font-size: 12px; color: var(--text2); cursor: pointer;
  display: flex; align-items: center; gap: 5px; transition: all .13s;
  font-family: inherit;
}
.tb-btn:hover { background: var(--surface2); color: var(--text); }
.tb-btn.primary {
  background: var(--accent-dim); color: var(--accent);
  border-color: var(--accent-bdr); font-weight: 500;
}
.tb-btn.primary:hover { background: rgba(37,99,235,0.15); }
#tab-count { font-size: 11px; color: var(--text3); }

/* ── Tab Cards ── */
.tab-card {
  position: absolute; width: 228px;
  background: var(--surface);
  border: 0.5px solid var(--border2);
  border-radius: var(--rl);
  box-shadow: var(--sh);
  cursor: grab; pointer-events: all;
  display: flex; flex-direction: column;
  transition: box-shadow .15s, border-color .15s;
}
.tab-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.1); border-color: rgba(0,0,0,0.2); }
.tab-card.dragging {
  cursor: grabbing; z-index: 500;
  box-shadow: 0 10px 28px rgba(0,0,0,0.13);
  border-color: var(--accent-bdr);
}
.tab-card.closed { opacity: .55; }

.tab-header {
  padding: 10px 12px 9px;
  border-bottom: 0.5px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  cursor: grab;
}
.tab-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; flex-shrink: 0; letter-spacing: .04em;
}
.tab-name {
  font-size: 13px; font-weight: 600; color: var(--text);
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tab-badge {
  font-size: 9px; padding: 2px 7px; border-radius: 20px;
  font-weight: 600; letter-spacing: .04em; text-transform: uppercase; flex-shrink: 0;
}
.b-open   { background: var(--green-dim); color: var(--green); border: 0.5px solid var(--green-bdr); }
.b-closed { background: var(--surface2);  color: var(--text3);  border: 0.5px solid var(--border); }

.tab-items {
  padding: 7px 12px; flex: 1;
  overflow-y: auto; max-height: 160px;
  scrollbar-width: thin; scrollbar-color: #e0ddd8 transparent;
}
.tab-empty { font-size: 11px; color: var(--text3); padding: 5px 0; font-style: italic; }
.tab-item {
  display: flex; align-items: center;
  padding: 3px 0; border-bottom: 0.5px solid var(--border); gap: 5px;
}
.tab-item:last-child { border-bottom: none; }
.item-name  { font-size: 11px; color: var(--text2); flex: 1; }
.item-price { font-size: 11px; font-weight: 600; color: var(--text); flex-shrink: 0; }
.item-del {
  background: none; border: none; cursor: pointer;
  color: var(--text3); line-height: 1; flex-shrink: 0;
  font-size: 15px; padding: 0 2px; transition: color .1s;
}
.item-del:hover { color: var(--red); }

.tab-footer {
  padding: 8px 12px; border-top: 0.5px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.tab-total { font-size: 13px; font-weight: 600; color: var(--text); }
.tab-actions { display: flex; gap: 4px; }
.act-btn {
  background: none; border: 0.5px solid var(--border2);
  border-radius: 6px; padding: 4px 7px; cursor: pointer;
  color: var(--text2); font-size: 13px;
  display: flex; align-items: center; transition: all .12s; line-height: 1;
}
.act-btn:hover        { background: var(--surface2);   color: var(--text); }
.act-btn.add:hover    { background: var(--accent-dim);  color: var(--accent); border-color: var(--accent-bdr); }
.act-btn.danger:hover { background: var(--red-dim);     color: var(--red);    border-color: var(--red-bdr); }

/* ── Panel ── */
#panel {
  position: fixed; right: 0; top: 0; bottom: 0; width: 272px;
  background: var(--surface);
  border-left: 0.5px solid var(--border2);
  box-shadow: -4px 0 20px rgba(0,0,0,0.07);
  z-index: 400; display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform .2s cubic-bezier(.4,0,.2,1);
}
#panel.open { transform: translateX(0); }
#panel-head {
  padding: 14px 16px 12px; border-bottom: 0.5px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
#panel-heading { font-size: 14px; font-weight: 600; color: var(--text); }
.close-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text3); display: flex; align-items: center; transition: color .1s;
}
.close-btn:hover { color: var(--text); }
#panel-body {
  flex: 1; overflow-y: auto; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 12px;
  scrollbar-width: thin; scrollbar-color: #e0ddd8 transparent;
}

.p-sec {
  font-size: 10px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text3);
  padding-bottom: 6px; border-bottom: 0.5px solid var(--border);
}
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 11px; color: var(--text3); font-weight: 500; }
.field input {
  background: var(--surface2); border: 0.5px solid var(--border2);
  border-radius: var(--r); padding: 7px 10px;
  font-size: 12px; color: var(--text);
  outline: none; transition: border-color .12s; font-family: inherit;
}
.field input:focus { border-color: var(--accent-bdr); background: #fff; }
.field input::placeholder { color: var(--text3); }
.p-submit {
  width: 100%; padding: 9px;
  background: var(--accent-dim); border: 0.5px solid var(--accent-bdr);
  border-radius: var(--r); font-size: 12px; font-weight: 600;
  color: var(--accent); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background .12s; font-family: inherit;
}
.p-submit:hover { background: rgba(37,99,235,0.15); }

.menu-row {
  display: flex; align-items: center;
  padding: 6px 8px; border-radius: var(--r); gap: 8px; transition: background .1s;
}
.menu-row:hover { background: var(--surface2); }
.menu-row-name  { font-size: 12px; color: var(--text2); flex: 1; }
.menu-row-price { font-size: 11px; color: var(--text3); flex-shrink: 0; }
.m-add {
  background: none; border: 0.5px solid var(--border2);
  border-radius: 5px; width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text3); flex-shrink: 0;
  transition: all .1s; font-family: inherit;
}
.m-add:hover  { background: var(--accent-dim); color: var(--accent); border-color: var(--accent-bdr); }
.m-add.ok     { background: var(--green-dim);  color: var(--green);  border-color: var(--green-bdr); }

/* ── Hint ── */
#hint {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--text3); background: var(--surface);
  border: 0.5px solid var(--border2); border-radius: 20px; padding: 5px 14px;
  pointer-events: none; z-index: 200; box-shadow: var(--sh); white-space: nowrap;
}
</style>
</head>
<body>

<div id="canvas">
  <svg id="grid-svg" width="100%" height="100%"></svg>
  <div id="tabs-layer"></div>

  <div id="toolbar">
    <span class="brand">
      <!-- beer mug icon -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 3h11a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
        <path d="M17 8h2a2 2 0 0 1 0 4h-2"/>
        <path d="M8 12v4M12 12v4"/>
      </svg>
      Bar Tabs
    </span>
    <button class="tb-btn primary" id="btn-new">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New tab
    </button>
    <button class="tb-btn" id="btn-reset">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
      Reset view
    </button>
    <span id="tab-count"></span>
  </div>
</div>

<div id="panel">
  <div id="panel-head">
    <span id="panel-heading">New tab</span>
    <button class="close-btn" id="panel-close" aria-label="Close panel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div id="panel-body"></div>
</div>

<div id="hint">Hold <strong>Space</strong> + drag or middle-click to pan &nbsp;·&nbsp; Drag cards to move</div>

<script>
/* ══════════════════════════════════════════
   INLINE SVG ICON HELPERS
══════════════════════════════════════════ */
const ICONS = {
  plus:    `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  check:   `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>`,
  addcir:  `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`,
  receipt: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1z"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="14" y2="14"/></svg>`,
  restore: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>`,
  trash:   `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>`,
  x:       `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
};

/* ══════════════════════════════════════════
   DATA
══════════════════════════════════════════ */
const MENU = [
  { name: 'Pint of lager',      price: 5.80 },
  { name: 'Pint of ale',        price: 6.20 },
  { name: 'G&T',                price: 7.50 },
  { name: 'House wine (glass)', price: 6.00 },
  { name: 'Prosecco',           price: 8.50 },
  { name: 'Whisky & Coke',      price: 7.20 },
  { name: 'Vodka soda',         price: 6.80 },
  { name: 'Mocktail',           price: 5.50 },
  { name: 'Soft drink',         price: 3.50 },
  { name: 'Nachos',             price: 7.00 },
  { name: 'Wings (6pc)',        price: 9.50 },
  { name: 'Chips & dip',        price: 5.00 },
];

const AVATAR_COLORS = [
  ['#dbeafe','#1d4ed8'], ['#dcfce7','#15803d'], ['#fef9c3','#a16207'],
  ['#fce7f3','#9d174d'], ['#ede9fe','#6d28d9'], ['#ffedd5','#c2410c'],
];

let tabs = [], nextId = 1, colorIdx = 0;
let panX = 0, panY = 0;
let isPanning = false, panStart = { x:0, y:0 }, spaceDown = false;
let dragState = null;
let panelTabId = null;

const canvas       = document.getElementById('canvas');
const tabsLayer    = document.getElementById('tabs-layer');
const panel        = document.getElementById('panel');
const panelHeading = document.getElementById('panel-heading');
const panelBody    = document.getElementById('panel-body');

/* ══════════════════════════════════════════
   GRID
══════════════════════════════════════════ */
function drawGrid() {
  const svg = document.getElementById('grid-svg');
  const w = window.innerWidth, h = window.innerHeight, step = 40;
  const ox = ((panX % step) + step) % step;
  const oy = ((panY % step) + step) % step;
  let d = '';
  for (let x = ox - step; x < w + step; x += step)
    d += `<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="rgba(0,0,0,0.05)" stroke-width="0.5"/>`;
  for (let y = oy - step; y < h + step; y += step)
    d += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="rgba(0,0,0,0.05)" stroke-width="0.5"/>`;
  svg.innerHTML = d;
}

/* ══════════════════════════════════════════
   RENDER — uses event delegation, NOT per-element listeners
   so re-renders never lose events
══════════════════════════════════════════ */
function renderTab(tab) {
  let el = document.getElementById('tab-' + tab.id);
  const isNew = !el;

  if (isNew) {
    el = document.createElement('div');
    el.id = 'tab-' + tab.id;
    el.className = 'tab-card';
    tabsLayer.appendChild(el);
    // Drag is attached ONCE on creation — never needs re-attaching
    attachDrag(el, tab.id);
  }

  el.className = 'tab-card' + (tab.closed ? ' closed' : '');
  el.style.left = (tab.x + panX) + 'px';
  el.style.top  = (tab.y + panY) + 'px';

  const [abg, afg] = AVATAR_COLORS[tab.colorIdx % AVATAR_COLORS.length];
  const initials   = tab.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
  const total      = tab.items.reduce((s, i) => s + i.price, 0);

  el.innerHTML = `
    <div class="tab-header">
      <div class="tab-avatar" style="background:${abg};color:${afg}">${initials}</div>
      <span class="tab-name">${esc(tab.name)}</span>
      <span class="tab-badge ${tab.closed ? 'b-closed' : 'b-open'}">${tab.closed ? 'closed' : 'open'}</span>
    </div>
    <div class="tab-items">
      ${tab.items.length === 0
        ? '<div class="tab-empty">No items yet</div>'
        : tab.items.map((item, i) => `
          <div class="tab-item">
            <span class="item-name">${esc(item.name)}</span>
            <span class="item-price">£${item.price.toFixed(2)}</span>
            ${!tab.closed ? `<button class="item-del" data-action="rm" data-idx="${i}" title="Remove">×</button>` : ''}
          </div>`).join('')}
    </div>
    <div class="tab-footer">
      <span class="tab-total">£${total.toFixed(2)}</span>
      <div class="tab-actions">
        ${!tab.closed ? `
          <button class="act-btn add"    data-action="add"   title="Add item">${ICONS.addcir}</button>
          <button class="act-btn danger" data-action="close" title="Close tab">${ICONS.receipt}</button>
        ` : `
          <button class="act-btn"        data-action="reopen" title="Reopen tab">${ICONS.restore}</button>
        `}
        <button class="act-btn danger" data-action="del" title="Delete tab">${ICONS.trash}</button>
      </div>
    </div>`;

  updateCount();
}

/* ── Single delegated click handler on the tabs layer ── */
tabsLayer.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  e.stopPropagation();

  const card = btn.closest('.tab-card');
  if (!card) return;
  const tabId = parseInt(card.id.replace('tab-', ''), 10);
  const tab   = tabs.find(t => t.id === tabId);
  if (!tab) return;

  const action = btn.dataset.action;

  if (action === 'add') {
    openAddPanel(tabId);
  } else if (action === 'close') {
    tab.closed = true;
    renderTab(tab);
    closePanelIf(tabId);
  } else if (action === 'reopen') {
    tab.closed = false;
    renderTab(tab);
  } else if (action === 'del') {
    card.remove();
    tabs = tabs.filter(t => t.id !== tabId);
    closePanelIf(tabId);
    updateCount();
  } else if (action === 'rm') {
    tab.items.splice(+btn.dataset.idx, 1);
    renderTab(tab);
  }
});

function updateCount() {
  const open = tabs.filter(t => !t.closed).length;
  document.getElementById('tab-count').textContent = `${open} open · ${tabs.length} total`;
}

/* ══════════════════════════════════════════
   DRAG (attached once per card, never re-attached)
══════════════════════════════════════════ */
function attachDrag(el, tabId) {
  el.addEventListener('mousedown', e => {
    // Ignore clicks on action buttons
    if (e.target.closest('[data-action]')) return;
    if (e.button !== 0) return;
    e.preventDefault();
    const tab = tabs.find(t => t.id === tabId);
    if (!tab) return;
    dragState = { tabId, startX: e.clientX, startY: e.clientY, origX: tab.x, origY: tab.y };
    el.classList.add('dragging');
  });
}

document.addEventListener('mousemove', e => {
  if (dragState) {
    const tab = tabs.find(t => t.id === dragState.tabId);
    if (tab) {
      tab.x = dragState.origX + (e.clientX - dragState.startX);
      tab.y = dragState.origY + (e.clientY - dragState.startY);
      const el = document.getElementById('tab-' + tab.id);
      if (el) { el.style.left = (tab.x + panX) + 'px'; el.style.top = (tab.y + panY) + 'px'; }
    }
    return;
  }
  if (isPanning) {
    panX += e.clientX - panStart.x;
    panY += e.clientY - panStart.y;
    panStart = { x: e.clientX, y: e.clientY };
    reposAll(); drawGrid();
  }
});

document.addEventListener('mouseup', () => {
  if (dragState) {
    document.getElementById('tab-' + dragState.tabId)?.classList.remove('dragging');
    dragState = null;
  }
  if (isPanning) { isPanning = false; canvas.style.cursor = spaceDown ? 'grab' : 'default'; }
});

canvas.addEventListener('mousedown', e => {
  if (e.button === 1 || (e.button === 0 && spaceDown)) {
    if (e.button === 1) e.preventDefault();
    isPanning = true; panStart = { x: e.clientX, y: e.clientY };
    canvas.style.cursor = 'grabbing';
  }
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.target.matches('input,textarea,select')) {
    spaceDown = true; canvas.style.cursor = 'grab'; e.preventDefault();
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') { spaceDown = false; canvas.style.cursor = 'default'; }
});

function reposAll() {
  tabs.forEach(tab => {
    const el = document.getElementById('tab-' + tab.id);
    if (el) { el.style.left = (tab.x + panX) + 'px'; el.style.top = (tab.y + panY) + 'px'; }
  });
}

/* ══════════════════════════════════════════
   PANELS
══════════════════════════════════════════ */
function openNewTabPanel() {
  panelTabId = null;
  panelHeading.textContent = 'New tab';
  panelBody.innerHTML = `
    <div class="p-sec">Customer / table</div>
    <div class="field">
      <label>Name</label>
      <input id="new-name" placeholder="e.g. Table 4 · Sarah" autocomplete="off"/>
    </div>
    <button class="p-submit" id="do-create">${ICONS.plus} Open tab</button>`;

  panel.classList.add('open');
  const inp = document.getElementById('new-name');
  inp.focus();

  function doCreate() {
    const name = document.getElementById('new-name').value.trim() || 'Tab ' + nextId;
    const x = (Math.random() * Math.max(window.innerWidth - 300, 80) + 20) - panX;
    const y = (Math.random() * Math.max(window.innerHeight - 240, 80) + 70) - panY;
    const tab = { id: nextId++, name, items: [], closed: false, x, y, colorIdx: colorIdx++ };
    tabs.push(tab);
    renderTab(tab);
    panel.classList.remove('open');
  }

  inp.addEventListener('keydown', e => { if (e.key === 'Enter') doCreate(); });
  document.getElementById('do-create').addEventListener('click', doCreate);
}

function openAddPanel(tabId) {
  const tab = tabs.find(t => t.id === tabId);
  if (!tab) return;

  panelTabId = tabId;
  panelHeading.textContent = tab.name;

  panelBody.innerHTML = `
    <div class="p-sec">Menu</div>
    ${MENU.map((m, i) => `
      <div class="menu-row">
        <span class="menu-row-name">${esc(m.name)}</span>
        <span class="menu-row-price">£${m.price.toFixed(2)}</span>
        <button class="m-add" data-mi="${i}" title="Add ${esc(m.name)}">${ICONS.plus}</button>
      </div>`).join('')}
    <div class="p-sec" style="margin-top:6px">Custom item</div>
    <div class="field">
      <label>Item name</label>
      <input id="cust-name" placeholder="e.g. Bottle of Champagne" autocomplete="off"/>
    </div>
    <div class="field">
      <label>Price (£)</label>
      <input id="cust-price" type="number" min="0" step="0.50" placeholder="0.00"/>
    </div>
    <button class="p-submit" id="do-add-custom">${ICONS.addcir} Add to tab</button>`;

  panel.classList.add('open');

  // Menu buttons — use event delegation on panelBody for robustness
  panelBody.addEventListener('click', function handler(e) {
    const btn = e.target.closest('.m-add');
    if (!btn) return;
    const m = MENU[+btn.dataset.mi];
    if (!m) return;
    tab.items.push({ name: m.name, price: m.price });
    renderTab(tab);
    btn.classList.add('ok');
    btn.innerHTML = ICONS.check;
    setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = ICONS.plus; }, 700);
  });

  function addCustom() {
    const nameEl  = document.getElementById('cust-name');
    const priceEl = document.getElementById('cust-price');
    const name    = nameEl ? nameEl.value.trim() : '';
    const price   = parseFloat(priceEl ? priceEl.value : 0) || 0;
    if (!name) { nameEl && nameEl.focus(); return; }
    tab.items.push({ name, price });
    renderTab(tab);
    nameEl.value = ''; priceEl.value = '';
    nameEl.focus();
  }

  document.getElementById('do-add-custom').addEventListener('click', addCustom);
  document.getElementById('cust-name').addEventListener('keydown', e => { if (e.key === 'Enter') addCustom(); });
}

function closePanelIf(id) {
  if (panelTabId === id) panel.classList.remove('open');
}

/* ══════════════════════════════════════════
   TOOLBAR
══════════════════════════════════════════ */
document.getElementById('btn-new').addEventListener('click', openNewTabPanel);
document.getElementById('panel-close').addEventListener('click', () => panel.classList.remove('open'));
document.getElementById('btn-reset').addEventListener('click', () => { panX = 0; panY = 0; reposAll(); drawGrid(); });

/* ══════════════════════════════════════════
   UTILS
══════════════════════════════════════════ */
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
